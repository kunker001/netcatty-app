name: android

# Compile the native Android client under android/.
# Branch and pull-request runs build the GitHub debug APK.
# Version tags build signed release APKs:
#   netcatty-<version>.apk         F-Droid reproducible binary, no self-updater
#   netcatty-<version>-github.apk  sideload build that installs updates itself
# Tag runs need Actions secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    name: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          set +e
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          do
            if [[ -x "$candidate" ]]; then
              sdkmanager="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [[ -z "$sdkmanager" ]]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null
          exit 0

      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          tagver="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$tagver" == "$version" ]]; then
            missing=()
            [[ -n "${ANDROID_KEYSTORE_BASE64}" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
            [[ -n "${ANDROID_KEYSTORE_PASSWORD}" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
            [[ -n "${ANDROID_KEY_ALIAS}" ]] || missing+=("ANDROID_KEY_ALIAS")
            [[ -n "${ANDROID_KEY_PASSWORD}" ]] || missing+=("ANDROID_KEY_PASSWORD")
            if (( ${#missing[@]} )); then
              echo "::error::Release tags need a signing key. Add GitHub Actions secrets: ${missing[*]}"
              exit 1
            fi
            keystore="$RUNNER_TEMP/netcatty-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            export ANDROID_KEYSTORE_PATH="$keystore"
            ./gradlew assembleFdroidRelease assembleGithubRelease --no-daemon --stacktrace
          else
            ./gradlew assembleGithubDebug --no-daemon --stacktrace
          fi

      - name: Name APK
        id: apk
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version" ]]; then
            version="0.0.0"
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          tagver="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$tagver" == "$version" ]]; then
            fdroid_src="app/build/outputs/apk/fdroid/release/app-fdroid-release.apk"
            github_src="app/build/outputs/apk/github/release/app-github-release.apk"
            if [[ ! -f "$fdroid_src" || ! -f "$github_src" ]]; then
              echo "::error::Signed release APKs were not produced."
              find app/build/outputs/apk -name '*.apk' -print
              exit 1
            fi
            aapt="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt -type f | sort | tail -n 1)"
            if [[ -z "$aapt" ]]; then
              echo "::error::aapt was not found under the Android SDK."
              exit 1
            fi
            if "$aapt" dump permissions "$fdroid_src" | grep -q REQUEST_INSTALL_PACKAGES; then
              echo "::error::F-Droid APK still requests REQUEST_INSTALL_PACKAGES."
              exit 1
            fi
            if ! "$aapt" dump permissions "$github_src" | grep -q REQUEST_INSTALL_PACKAGES; then
              echo "::error::GitHub APK is missing REQUEST_INSTALL_PACKAGES."
              exit 1
            fi
            cp "$github_src" "$GITHUB_WORKSPACE/artifacts/netcatty-${tagver}-github.apk"
            cp "$fdroid_src" "$GITHUB_WORKSPACE/artifacts/netcatty-${tagver}.apk"
            echo "artifact=netcatty-v${tagver}" >> "$GITHUB_OUTPUT"
          else
            name="netcatty-${version}-${GITHUB_SHA:0:7}-debug.apk"
            cp app/build/outputs/apk/github/debug/app-github-debug.apk "$GITHUB_WORKSPACE/artifacts/${name}"
            echo "artifact=${name}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
